name: Release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*-seamless.*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test and build source plus offline packages
        shell: powershell
        run: .\scripts\Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DragonCodexBoot-packages
          path: releases/*
          if-no-files-found: error
